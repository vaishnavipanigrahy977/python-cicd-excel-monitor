name: Python CI/CD & Microsoft Excel Assessment

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - 'Assessment_Results.xlsx'
  schedule:
    - cron: '0 9 * * *' # Runs automatically every day at 9:00 AM UTC (2:30 PM IST)
  workflow_dispatch:    # Lets you click "Run workflow" manually anytime

jobs:
  # STAGE 1: RUN AUTOMATED UNIT TESTS
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest unit tests
        run: python -m pytest

  # STAGE 2: RUN RUNTIME CHECK, UPDATE EXCEL & SEND TO OUTLOOK
  assess-and-submit:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Runtime Assessment & Submit to Excel/Outlook
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          APP_NAME: "ROBO-AI-AGENT"
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
        run: python monitor.py

      - name: Upload Excel Report Artifact
        uses: actions/upload-artifact@v7
        with:
          name: Assessment_Results_Excel
          path: Assessment_Results.xlsx

      - name: Save Updated Excel Log to Repository
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add Assessment_Results.xlsx
          git diff --staged --quiet || git commit -m "chore: update Excel runtime assessment log"
          git push
